name: Proceso de Empaquetado Automático

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4
      
      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instalar dependencias necesarias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Convertir script a ejecutable
        run: pyinstaller --onefile --windowed main.py
        
      - name: Generar artifact resultante
        uses: actions/upload-artifact@v4
        with:
          name: MiProgramaEjecutable
          path: dist/main.exe